    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>常磐線順光マップ</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body { margin: 0; display: flex; font-family: sans-serif; height: 100vh; background: #f4f7f6; overflow: hidden; }
        #side-panel { width: 380px; padding: 20px; overflow-y: auto; background: white; box-shadow: 2px 0 10px rgba(0,0,0,0.1); z-index: 1000; }
        #map { flex-grow: 1; height: 100%; }
        @media (max-width: 768px) {
            body { flex-direction: column; }
            #side-panel { width: 100%; height: 45%; padding: 15px; box-sizing: border-box; order: 2; overflow-y: auto; }
            #map { height: 55%; width: 100%; order: 1; }
        }
        .card { background: #fff; border: 1px solid #ddd; padding: 12px; margin-bottom: 15px; border-radius: 8px; }
        h3 { margin-top: 0; color: #1a73e8; border-bottom: 2px solid #1a73e8; padding-bottom: 5px; font-size: 18px; }
        h4 { margin: 10px 0 5px; font-size: 14px; color: #555; }
        input, select { width: 100%; padding: 12px; margin: 5px 0 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 12px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 5px; font-size: 14px; }
        .btn-blue { background: #1a73e8; color: white; }
        .btn-green { background: #34a853; color: white; }
        .spot-item { border-left: 5px solid #34a853; background: #f8f9fa; padding: 10px; margin-top: 8px; border-radius: 4px; position: relative; }
        .delete-btn { position: absolute; right: 8px; top: 10px; background: #ea4335; color: white; padding: 4px 8px; font-size: 10px; border-radius: 3px; width: auto !important; }
        .pass-time { font-size: 12px; color: #666; font-weight: bold; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 10px; font-weight: bold; color: white; margin-top: 5px; }
        .badge-up { background: #dc3545; }
        .badge-down { background: #28a745; }
        .warning-text { color: #d93025; font-weight: bold; font-size: 11px; margin-left: 5px; }
    </style>
</head>
<body>

<div id="side-panel">
    <h3>常磐線順光マップ</h3>
    <div class="card">
        <h4>📅 条件設定</h4>
        <input type="date" id="date-input">
    </div>
    <div class="card">
        <h4>🚄 運行列車 (自動方向判別)</h4>
        <label><small>始発駅</small></label>
        <select id="start-station"></select>
        <input type="time" id="start-time" value="07:00">
        <label><small>終着駅</small></label>
        <select id="end-station"></select>
        <input type="time" id="end-time" value="09:23">
        <button class="btn-blue" onclick="updateAllSpotsGeneral()">判定実行</button>
    </div>
    <div class="card">
        <h4>📍 撮影地点の登録</h4>
        <div id="distance-display" style="font-size:12px; color:#d93025; font-weight:bold; margin-bottom:5px;">地図をクリック</div>
        <input type="text" id="spot-name" placeholder="撮影地名を入力">
        <select id="spot-target">
            <option value="down">下り（いわき方面）</option>
            <option value="up">上り（上野方面）</option>
        </select>
        <label><small>カメラ(レンズの反対側)の向き (0:北, 90:東...)</small></label>
        <input type="number" id="spot-cam" value="0">
        <button class="btn-green" onclick="saveSpot()">地点を保存</button>
    </div>
    <div id="spot-list"></div>
</div>

    let railLines = [];
    if (railGeoJSON.features.length > 0) {
        L.geoJSON(railGeoJSON, { style: { color: "blue", weight: 3, opacity: 0.6 } }).addTo(map);
        railGeoJSON.features.forEach(f => {
            const coords = f.geometry.type === "MultiLineString" ? f.geometry.coordinates[0] : f.geometry.coordinates;
            railLines = railLines.concat(coords);
        });
    }

    const sSel = document.getElementById('start-station');
    const eSel = document.getElementById('end-station');
    stations.forEach(s => {
        sSel.add(new Option(s.name, s.km));
        eSel.add(new Option(s.name, s.km));
    });

    const STORAGE_KEY = 'jouban_spots_final_v110';
    let savedSpots = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    let currentPoint = null;
    let arrowGroup = L.layerGroup().addTo(map);
    let markerGroup = L.layerGroup().addTo(map);
    document.getElementById('date-input').value = new Date().toISOString().split('T')[0];

    function getPreciseKm(lat, lng) {
        let nearest = stations[0], minDist = Infinity;
        stations.forEach(s => {
            const d = Math.pow(s.lat - lat, 2) + Math.pow(s.lng - lng, 2);
            if (d < minDist) { minDist = d; nearest = s; }
        });
        const latDiffKm = (lat - nearest.lat) * 111;
        const lngDiffKm = (lng - nearest.lng) * 91;
        return nearest.km + (latDiffKm + lngDiffKm * 0.5); 
    }

    map.on('click', (e) => {
        let lat = e.latlng.lat, lng = e.latlng.lng, angleBase = 0;
        if (railLines.length >= 2) {
            let minDist = Infinity, idx = 0;
            railLines.forEach((c, i) => {
                const d = Math.pow(c[1]-lat, 2) + Math.pow(c[0]-lng, 2);
                if(d < minDist){ minDist = d; idx = i; }
            });
            const p = railLines[idx];
            lat = p[1]; lng = p[0];
            const p1 = railLines[Math.max(0, idx - 1)];
            const p2 = railLines[Math.min(railLines.length - 1, idx + 1)];
            const km1 = getPreciseKm(p1[1], p1[0]);
            const km2 = getPreciseKm(p2[1], p2[0]);
            let dy, dx;
            if (km2 > km1) { dy = p2[1] - p1[1]; dx = p2[0] - p1[0]; }
            else { dy = p1[1] - p2[1]; dx = p1[0] - p2[0]; }
            angleBase = (Math.atan2(dx, dy) * 180 / Math.PI + 360) % 360;
        }
        const estKm = getPreciseKm(lat, lng);
        currentPoint = { lat, lng, angleBase, km: estKm };
        document.getElementById('distance-display').innerHTML = `選択中: ${estKm.toFixed(2)}km`;
        if(window.clickMarker) map.removeLayer(window.clickMarker);
        window.clickMarker = L.marker([lat, lng]).addTo(map);
    });

    function saveSpot() {
        if(!currentPoint) return alert("地図をクリックしてください");
        savedSpots.push({
            id: Date.now(), 
            name: document.getElementById('spot-name').value || "無題の地点",
            lat: currentPoint.lat, lng: currentPoint.lng, km: currentPoint.km,
            lineAngle: currentPoint.angleBase,
            camAngle: parseFloat(document.getElementById('spot-cam').value),
            targetBound: document.getElementById('spot-target').value
        });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(savedSpots));
        document.getElementById('spot-name').value = "";
        renderList();
    }

    function updateAllSpotsGeneral() {
        const kmStart = parseFloat(sSel.value);
        const kmEnd = parseFloat(eSel.value);
        const tStart = toMin(document.getElementById('start-time').value);
        const tEnd = toMin(document.getElementById('end-time').value);
        const trainDirection = kmStart < kmEnd ? 'down' : 'up';
        const dateStr = document.getElementById('date-input').value;

        savedSpots.forEach(s => {
            const progress = (s.km - kmStart) / (kmEnd - kmStart);
            if (progress >= 0 && progress <= 1) {
                const resMin = tStart + (tEnd - tStart) * progress;
                s.currentPredictTime = minToTime(resMin);
                const isMatching = s.targetBound === trainDirection;
                s.isReverseTrain = !isMatching;
                const currentTrainAngle = (trainDirection === 'up') ? (s.lineAngle + 180) % 360 : s.lineAngle;
                s.activeTrainAngle = currentTrainAngle;

                // --- 高度判定を含む判定ロジック ---
                const sunPos = SunCalc.getPosition(new Date(`${dateStr}T${s.currentPredictTime}`), s.lat, s.lng);
                const sunAlt = sunPos.altitude * 180 / Math.PI;
                const sunAz = (sunPos.azimuth * 180 / Math.PI + 180) % 360;

                if (sunAlt <= 0) {
                    s.icon = "🌑"; 
                    s.statusText = "（露出なし）";
                } else if (isMatching) {
                    let diff = Math.abs(currentTrainAngle - sunAz) % 360;
                    if (diff > 180) diff = 360 - diff;
                    if (diff < 45) s.icon = "🔥";
                    else if (diff < 90) s.icon = "✅";
                    else s.icon = "☁️";
                    s.statusText = "";
                } else {
                    s.icon = "☁️";
                    s.statusText = "";
                }
            } else {
                s.currentPredictTime = null;
                s.icon = "📍";
                s.isReverseTrain = false;
                s.statusText = "";
            }
        });
        renderList();
    }

    function renderList() {
        savedSpots.sort((a, b) => a.km - b.km);
        const container = document.getElementById('spot-list');
        container.innerHTML = "<h4>📷 登録リスト</h4>";
        markerGroup.clearLayers();
        savedSpots.forEach(s => {
            const warn = s.isReverseTrain ? '<span class="warning-text">【ケツ打ち】</span>' : "";
            const div = document.createElement('div');
            div.className = 'spot-item';
            div.innerHTML = `
                <div class="spot-header">
                    <span>${s.icon || '📍'} <b>${s.name}</b> ${warn}</span>
                    <button class="delete-btn" onclick="deleteSpot(${s.id}); event.stopPropagation();">削除</button>
                </div>
                <div class="pass-time">通過: ${s.currentPredictTime || '--:--'} (${s.km.toFixed(1)}k) <small>${s.statusText || ''}</small></div>
                <span class="badge ${s.targetBound==='up'?'badge-up':'badge-down'}">${s.targetBound==='up'?'上り':'下り'}</span>
            `;
            div.onclick = () => showVisuals(s);
            container.appendChild(div);
            L.circleMarker([s.lat, s.lng], {color: 'blue', radius: 5}).addTo(markerGroup);
        });
    }

    function showVisuals(s) {
        arrowGroup.clearLayers();
        map.setView([s.lat, s.lng], 16);
        const timeStr = s.currentPredictTime || "12:00";
        const sun = SunCalc.getPosition(new Date(`${document.getElementById('date-input').value}T${timeStr}`), s.lat, s.lng);
        const sunAz = (sun.azimuth * 180 / Math.PI + 180) % 360;
        drawArrow(s.lat, s.lng, sunAz, '#ff9800', 8, false); // 太陽
        drawArrow(s.lat, s.lng, s.activeTrainAngle || s.lineAngle, '#1a73e8', 5, true); // 列車顔
        drawArrow(s.lat, s.lng, s.camAngle, '#ea4335', 5, true); // カメラレンズ
    }

    function drawArrow(lat, lng, deg, color, weight, isFlipped) {
        let finalDeg = isFlipped ? (deg + 180) % 360 : deg;
        const angleRad = (90 - finalDeg) * (Math.PI / 180);
        const len = 0.002;
        const endLat = lat + Math.sin(angleRad) * len;
        const endLng = lng + Math.cos(angleRad) * len;
        L.polyline([[lat, lng], [endLat, endLng]], {color: color, weight: weight, lineCap: 'round'}).addTo(arrowGroup);
    }

    function deleteSpot(id) { savedSpots = savedSpots.filter(s => s.id !== id); localStorage.setItem(STORAGE_KEY, JSON.stringify(savedSpots)); renderList(); }
    function toMin(t) { const [h,m] = t.split(':').map(Number); return h*60+m; }
    function minToTime(min) { const h = Math.floor(min/60), m = Math.floor(min%60); return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`; }
    renderList();
</script>
